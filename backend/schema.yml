components:
  schemas:
    CastMember:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        photo:
          type: string
          format: uri
          nullable: true
        biography:
          type: string
          nullable: true
      required:
      - id
      - name
    Episode:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        episode_number:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        title:
          type: string
          maxLength: 255
        description:
          type: string
        thumbnail:
          type: string
          format: uri
        video_url:
          type: string
          format: uri
          maxLength: 500
        duration:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: Duration in minutes
        release_date:
          type: string
          format: date
        season:
          type: integer
      required:
      - description
      - duration
      - episode_number
      - id
      - release_date
      - season
      - thumbnail
      - title
      - video_url
    Genre:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        slug:
          oneOf:
          - type: string
            maxLength: 100
            pattern: ^[-a-zA-Z0-9_]+$
          - type: string
            maxLength: 0
      required:
      - id
      - name
    Language:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        code:
          type: string
          maxLength: 10
      required:
      - code
      - id
      - name
    MovieDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        genres:
          type: array
